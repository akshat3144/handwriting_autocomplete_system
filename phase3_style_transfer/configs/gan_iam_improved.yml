device: 'cuda:0'
model: 'gl_adversarial_model'
dataset: 'iam_word_org'
seed: 123456
img_height: 64
char_width: 32

training:
  dset_split: 'trnval'
  epochs: 70
  lr_policy: 'linear'
  start_decay_epoch: 25
  n_epochs_decay: 46
  
  # IMPROVED: Larger batch for better statistics
  batch_size: 24  # was 16
  eval_batch_size: 32  # was 16
  sample_nrow: 3
  
  # IMPROVED: Lower LR for stability
  lr: 1.5e-4  # was 2.0e-4
  adam_b1: 0.5
  adam_b2: 0.999
  
  # sampling and saving
  sample_iter_val: 200
  print_iter_val: 20
  start_save_epoch_val: 20
  save_epoch_val: 2
  sample_dir: 'imgs'
  ckpt_dir: 'ckpts'
  
  lexicon: './data/english_words.txt'
  max_word_len: 20
  n_class: 80
  capitalize_ratio: 0.5
  blank_ratio: 0.
  sort_input: true
  
  # IMPROVED: More discriminator updates
  num_critic_train: 5  # was 4
  
  vae_mode: true
  
  # IMPROVED: Better loss weights
  lambda_kl: 0.0005  # was 0.0001 (more KL regularization)
  lambda_ctx: 1.5  # was 1.0 (stronger contextual loss)
  lambda_gram: 2.5  # was 2.0 (stronger gram loss)
  lambda_perceptual: 2.0  # NEW: perceptual loss
  lambda_consistency: 0.1  # NEW: discriminator consistency
  
  # NEW: Dynamic gradient penalty settings
  use_dynamic_gp: true
  gp_ema_momentum: 0.9
  
  # NEW: Curriculum learning
  use_curriculum: true
  curriculum_warmup_epochs: 15
  curriculum_min_len: 3
  
  pretrained_w: './pretrained/wid_iam_new.pth'
  pretrained_r: './pretrained/ocr_iam_new.pth'
  pretrained_ckpt: ''

valid:
  dset_name: 'iam_word_org'
  dset_split: 'test'
  use_rand_corpus: false
  n_rand_repeat: 10
  batch_size: 32
  
  # IMPROVED: Better FID calculation
  dims: 2048
  num_fid_samples: 10000  # NEW: more samples for stable FID
  num_fid_runs: 3  # NEW: multiple runs for confidence
  
  mmd_degree: 3
  mmd_gamma: ~
  mmd_coef0: 1.
  mmd_subsets: 50
  mmd_subset_size: 1000
  mmd_var: true
  pretrained_test_w: './pretrained/wid_iam_test.pth'
  test_wid_model:
    n_writer: 128
    in_dim: 256
    init: 'none'
  ctcdecode:
    model_path: ~
    blank_id: 0
    alpha: 1
    beta: 3
    beam_width: 32
    cutoff_prob: 0.9999
    cutoff_top_n: 32
    num_processes: 8

test:
  interp_num: 7
  nrow: 8

# IMPROVED: Generator with multi-scale attention
GenModel:
  G_ch: 64
  style_dim: 64  # was 32 (larger latent space)
  bottom_width: 4
  bottom_height: 4
  resolution: 64
  G_kernel_size: 3
  G_attn: '32_64'  # was '0' - CRITICAL: enables multi-scale attention
  n_class: 80
  embed_dim: 120
  embed_pad_idx: 0
  embed_max_norm: 1.0
  num_G_SVs: 1
  num_G_SV_itrs: 1
  cross_replica: false
  mybn: false
  BN_eps: 1.e-05
  SN_eps: 1.e-08
  init: 'N02'
  G_param: 'SN'
  norm_style: 'bn'
  bn_linear: 'SN'
  input_nc: 1

# IMPROVED: Discriminator with attention and wider channels
DiscModel:
  D_ch: 96  # was 64 (wider discriminator)
  D_wide: true
  resolution: 64
  D_kernel_size: 3
  D_attn: '32_64'  # was '0' - enables multi-scale attention
  n_class: 80
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

PatchDiscModel:
  D_ch: 64
  D_wide: true
  resolution: 32
  D_kernel_size: 3
  D_attn: '0'
  n_class: 80
  num_D_SVs: 1
  num_D_SV_itrs: 1
  SN_eps: 1.e-08
  output_dim: 1
  init: 'N02'
  D_param: 'SN'
  bn_linear: 'SN'
  input_nc: 1
  one_hot: true

# IMPROVED: Better OCR with deeper RNN and dropout
OcrModel:
  resolution: 16
  max_dim: 256
  in_channel: 1
  norm: 'bn'
  init: 'none'
  dropout: 0.2  # was 0.0 (add regularization)
  n_class: 80
  rnn_depth: 3  # was 2 (deeper for better recognition)
  bidirectional: true

StyBackbone:
  resolution: 16
  max_dim: 256
  in_channel: 1
  init: 'N02'
  dropout: 0.1  # was 0.0
  norm: 'bn'

EncModel:
  style_dim: 64  # was 32 (match GenModel)
  in_dim: 256
  init: 'none'

WidModel:
  n_writer: 372
  in_dim: 256
  init: 'none'

# NEW: Augmentation settings
augmentation:
  enabled: true
  elastic_transform: true
  elastic_alpha: 10
  elastic_sigma: 3
  elastic_prob: 0.5
  perspective_distortion: 0.1
  perspective_prob: 0.3
  thickness_variation: true
  thickness_prob: 0.4
  noise_std: 0.02

# NEW: Advanced training options
advanced:
  use_mixed_precision: false  # Set true if you have GPU with Tensor Cores
  gradient_clip_value: 5.0
  log_grad_norms: true
  ema_decay: 0.999  # Exponential moving average for G
  use_ema_for_eval: true
